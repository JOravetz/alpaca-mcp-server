<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momentum Stocks Analysis | Professional Trading Dashboard</title>
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #0f1823;
            --bg-tertiary: #1a2332;
            --bg-card: #1e2938;
            --bg-hover: #243447;
            
            --text-primary: #e8eaed;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-purple: #8b5cf6;
            
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stock-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .stock-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-blue);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.2);
        }

        .symbol {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-blue);
            margin-bottom: 10px;
        }

        .price {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .change {
            font-size: 1rem;
            font-weight: 600;
        }

        .positive { color: var(--success); }
        .negative { color: var(--danger); }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            max-width: 1200px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 30px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.8rem;
            color: var(--text-primary);
        }

        .close-btn {
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: #dc2626;
        }

        .modal-body {
            padding: 30px;
        }

        .chart-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .chart-container img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .loading {
            text-align: center;
            color: var(--text-secondary);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            color: var(--danger);
            text-align: center;
            padding: 20px;
        }

        .success-message {
            color: var(--success);
            text-align: center;
            padding: 10px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .chart-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .control-select {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-primary);
            cursor: pointer;
        }

        .generate-btn {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            align-self: flex-end;
        }

        .generate-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(59, 130, 246, 0.4);
        }

        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Momentum Stocks Dashboard</h1>
            <div class="subtitle">Click any stock to generate technical analysis chart</div>
        </div>
        
        <div class="grid" id="stockGrid">
            <!-- Stocks will be populated here -->
        </div>
    </div>
    
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Loading...</h2>
                <button class="close-btn" onclick="closeModal()">✕ Close</button>
            </div>
            <div class="modal-body">
                <div class="chart-controls">
                    <div class="control-group">
                        <label class="control-label">Timeframe</label>
                        <select id="timeframe" class="control-select">
                            <option value="1Day" selected>Daily</option>
                            <option value="1Hour">1 Hour</option>
                            <option value="30Min">30 Min</option>
                            <option value="15Min">15 Min</option>
                            <option value="5Min">5 Min</option>
                            <option value="1Min">1 Min</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label class="control-label">Days</label>
                        <select id="days" class="control-select">
                            <option value="7">7 days</option>
                            <option value="14">14 days</option>
                            <option value="30" selected>30 days</option>
                            <option value="60">60 days</option>
                            <option value="90">90 days</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label class="control-label">Window</label>
                        <select id="window" class="control-select">
                            <option value="5">5</option>
                            <option value="11" selected>11</option>
                            <option value="21">21</option>
                            <option value="31">31</option>
                        </select>
                    </div>
                    <button class="generate-btn" onclick="generateChart()">Generate Chart</button>
                </div>
                
                <div class="chart-container" id="chartContainer">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Click "Generate Chart" to create analysis...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Stock data
        const stocks = [
            {symbol: 'NEON', company: 'Neonode Inc.', price: 26.48, change: 5.92},
            {symbol: 'RKLB', company: 'Rocket Lab USA', price: 45.15, change: 1.74},
            {symbol: 'ASTS', company: 'AST SpaceMobile', price: 47.89, change: 1.74},
            {symbol: 'CLS', company: 'Celestica Inc.', price: 191.00, change: 1.10},
            {symbol: 'PLTR', company: 'Palantir Tech', price: 159.68, change: 0.59},
            {symbol: 'NVDA', company: 'NVIDIA Corp', price: 178.38, change: 0.22},
            {symbol: 'MSTR', company: 'MicroStrategy', price: 358.50, change: 0.10},
            {symbol: 'HOOD', company: 'Robinhood', price: 109.46, change: 0.13},
            {symbol: 'TQQQ', company: 'ProShares Ultra', price: 90.76, change: 0.42},
            {symbol: 'APP', company: 'AppLovin', price: 443.75, change: 0.47},
            {symbol: 'KTOS', company: 'Kratos Defense', price: 67.14, change: 0.64},
            {symbol: 'VST', company: 'Vistra Corp', price: 191.00, change: 0.28}
        ];
        
        let currentSymbol = '';
        
        function renderStocks() {
            const grid = document.getElementById('stockGrid');
            grid.innerHTML = stocks.map(stock => `
                <div class="stock-card" onclick="showModal('${stock.symbol}')">
                    <div class="symbol">${stock.symbol}</div>
                    <div style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 10px;">${stock.company}</div>
                    <div class="price">$${stock.price.toFixed(2)}</div>
                    <div class="change ${stock.change >= 0 ? 'positive' : 'negative'}">
                        ${stock.change >= 0 ? '↑' : '↓'} ${stock.change >= 0 ? '+' : ''}${stock.change.toFixed(2)}%
                    </div>
                </div>
            `).join('');
        }
        
        function showModal(symbol) {
            currentSymbol = symbol;
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modalTitle');
            const chartContainer = document.getElementById('chartContainer');
            
            modalTitle.textContent = `${symbol} - Technical Analysis`;
            modal.classList.add('active');
            
            // Reset chart container
            chartContainer.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Click "Generate Chart" to create analysis...</p>
                </div>
            `;
        }
        
        async function generateChart() {
            if (!currentSymbol) return;
            
            const chartContainer = document.getElementById('chartContainer');
            const timeframe = document.getElementById('timeframe').value;
            const days = document.getElementById('days').value;
            const window = document.getElementById('window').value;
            
            // Show loading
            chartContainer.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Generating chart for ${currentSymbol}...</p>
                    <p style="margin-top: 10px; font-size: 0.9rem; color: var(--text-muted);">
                        Parameters: ${timeframe}, ${days} days, window ${window}
                    </p>
                </div>
            `;
            
            try {
                // First try the API endpoint
                const response = await fetch(`http://localhost:8002/api/chart/${currentSymbol}?timeframe=${timeframe}&days=${days}&window=${window}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.status === 'success' && data.chart_data) {
                    // Display the chart
                    chartContainer.innerHTML = `
                        <img src="${data.chart_data}" alt="${currentSymbol} Chart" style="max-width: 100%; height: auto;">
                    `;
                } else if (data.status === 'success' && data.analysis) {
                    // Display analysis text if no chart
                    chartContainer.innerHTML = `
                        <div style="padding: 20px; color: var(--text-primary);">
                            <h3>Analysis Results</h3>
                            <p>Price Range: ${data.analysis.price_range || 'N/A'}</p>
                            <p>Total Bars: ${data.analysis.total_bars || 0}</p>
                            <p style="margin-top: 20px; color: var(--text-secondary);">
                                Chart visualization not available. Showing analysis data.
                            </p>
                        </div>
                    `;
                } else {
                    // Fallback to sample chart
                    generateSampleChart();
                }
            } catch (error) {
                console.error('Error fetching chart:', error);
                // Generate a sample chart as fallback
                generateSampleChart();
            }
        }
        
        function generateSampleChart() {
            // Create a sample chart using Canvas
            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 400;
            const ctx = canvas.getContext('2d');
            
            // Dark background
            ctx.fillStyle = '#1e2938';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Title
            ctx.fillStyle = '#e8eaed';
            ctx.font = 'bold 20px Arial';
            ctx.fillText(`${currentSymbol} - Technical Analysis`, 20, 30);
            
            // Generate sample data
            const dataPoints = 30;
            const data = [];
            let price = 100;
            for (let i = 0; i < dataPoints; i++) {
                price += (Math.random() - 0.5) * 5;
                data.push(price);
            }
            
            // Find min and max for scaling
            const minPrice = Math.min(...data);
            const maxPrice = Math.max(...data);
            const priceRange = maxPrice - minPrice;
            
            // Draw grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 5; i++) {
                const y = 60 + (i * 300 / 5);
                ctx.beginPath();
                ctx.moveTo(50, y);
                ctx.lineTo(750, y);
                ctx.stroke();
            }
            
            // Draw price line
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < data.length; i++) {
                const x = 50 + (i * 700 / (data.length - 1));
                const y = 360 - ((data[i] - minPrice) / priceRange) * 300;
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();
            
            // Draw peaks and troughs
            ctx.fillStyle = '#ef4444';
            for (let i = 1; i < data.length - 1; i++) {
                if (data[i] > data[i-1] && data[i] > data[i+1]) {
                    const x = 50 + (i * 700 / (data.length - 1));
                    const y = 360 - ((data[i] - minPrice) / priceRange) * 300;
                    ctx.beginPath();
                    ctx.arc(x, y, 5, 0, 2 * Math.PI);
                    ctx.fill();
                }
            }
            
            ctx.fillStyle = '#10b981';
            for (let i = 1; i < data.length - 1; i++) {
                if (data[i] < data[i-1] && data[i] < data[i+1]) {
                    const x = 50 + (i * 700 / (data.length - 1));
                    const y = 360 - ((data[i] - minPrice) / priceRange) * 300;
                    ctx.beginPath();
                    ctx.arc(x, y, 5, 0, 2 * Math.PI);
                    ctx.fill();
                }
            }
            
            // Legend
            ctx.font = '14px Arial';
            ctx.fillStyle = '#ef4444';
            ctx.fillText('● Peaks', 650, 50);
            ctx.fillStyle = '#10b981';
            ctx.fillText('● Troughs', 650, 70);
            
            // Convert to image and display
            const chartContainer = document.getElementById('chartContainer');
            chartContainer.innerHTML = '';
            chartContainer.appendChild(canvas);
            
            // Add message
            const message = document.createElement('div');
            message.className = 'success-message';
            message.textContent = 'Sample chart generated (API connection may be limited)';
            chartContainer.appendChild(message);
        }
        
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            currentSymbol = '';
        }
        
        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
        
        // Initialize
        renderStocks();
    </script>
</body>
</html>
