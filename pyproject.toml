[project]
name = "alpaca-mcp-server"
version = "1.0.0"
description = "Professional Alpaca MCP Server with advanced prompt engineering, institutional-grade analysis, and real-time streaming capabilities"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = [
    "alpaca", "trading", "mcp", "model-context-protocol", 
    "finance", "stocks", "options", "market-data", "streaming",
    "prompt-engineering", "ai-trading", "institutional-analysis"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "alpaca-py>=0.40.1",
    "alpaca-trade-api>=3.2.0",
    "mcp>=1.9.3",
    "python-dotenv>=1.1.0",
    "psutil>=5.9.0",
    "scipy>=1.15.3",
    "numpy>=2.2.6",
    "pytz>=2024.1",
    "matplotlib>=3.10.3",
    "pandas>=2.3.0",
    "pandas-market-calendars>=4.4.0",
    "pydantic>=2.11.5",
    "aiohttp>=3.12.9",
    "aiofiles>=24.1.0",
    "websockets>=10.4",
    "requests>=2.32.3",
    "fastapi>=0.115.13",
    "uvicorn>=0.34.3",
    "feedparser>=6.0.11",
    "toml>=0.10.2",
    "playwright>=1.54.0",
    "onnxruntime>=1.22.1",
    "soundfile>=0.13.1",
    "finvizfinance>=1.2.0",
]

[project.scripts]
alpaca-mcp-server = "alpaca_mcp_server.main:main"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
    "mypy>=1.16.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.0.0",
    "ruff>=0.11.13",
    "bandit[toml]>=1.7.10",
    "pre-commit>=4.0.1",
    "types-psutil>=7.0.0.20250801",
    "types-requests>=2.31.0.6",
    "pandas-stubs>=2.3.0.250703",
]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG001", # unused-function-args
    "C901", # too-complex
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "ARG001", # unused function argument
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false  # Too strict for real-world usage
warn_unused_configs = true
disallow_untyped_defs = false  # Enable incrementally, not globally
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false  # FastMCP decorators are untyped
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false  # Don't warn about extra ignores
warn_no_return = true
warn_unreachable = false  # Can create false positives
strict_equality = true
ignore_missing_imports = false  # Still check imports
allow_untyped_calls = true  # Allow calls to untyped functions (third-party libs)
allow_untyped_defs = true  # Allow untyped functions (gradual typing)
exclude = [
    "alpaca_mcp_server/monitoring/backup/",
    "alpaca_mcp_server/tests/",
]

# Per-module overrides for missing stubs
[[tool.mypy.overrides]]
module = "win10toast"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "peakdetect"
ignore_missing_imports = true

[tool.bandit]
skips = ["B101", "B601"]
exclude_dirs = ["tests", ".venv", "build"]

[tool.pytest.ini_options]
testpaths = ["alpaca_mcp_server/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30
addopts = [
    "--strict-markers",
    "--tb=short",
    "--timeout=30",
    "--cov=alpaca_mcp_server",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "performance: marks tests as performance tests",
]

[tool.coverage.run]
source = ["alpaca_mcp_server"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__main__.py",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
