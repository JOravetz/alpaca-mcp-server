# Pre-commit hooks for code quality
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-docstring-first
      - id: debug-statements

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3.12
        args: ["--line-length=100"]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black", "--line-length=100"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-pytz]
        args: [--ignore-missing-imports, --no-strict-optional]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]

  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest-unit
        entry: uv run pytest alpaca_mcp_server/tests/unit/ -x -q
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-push]

      - id: no-secrets
        name: check-for-secrets
        entry: |
          python -c "
          import re, sys
          patterns = [
              r'APCA_API_KEY_ID\s*=\s*[\'\"]\w+[\'\"]',
              r'APCA_API_SECRET_KEY\s*=\s*[\'\"]\w+[\'\"]',
              r'sk-[a-zA-Z0-9]{48}',  # OpenAI API keys
              r'[A-Z0-9]{20}:[A-Z0-9]{40}',  # Alpaca keys pattern
          ]
          for line_num, line in enumerate(sys.stdin, 1):
              for pattern in patterns:
                  if re.search(pattern, line):
                      print(f'Line {line_num}: Potential secret detected')
                      sys.exit(1)
          "
        language: python
        entry: grep -rE "(APCA_API_KEY_ID|APCA_API_SECRET_KEY|sk-[a-zA-Z0-9]{48})" --include="*.py" --include="*.yml" --include="*.yaml" . && echo "Potential secrets detected!" && exit 1 || exit 0
        language: system